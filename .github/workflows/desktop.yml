name: Windows desktop
on:
  push:
    branches: [master, main]
    paths: ['src-tauri/**', 'resources/**', 'public/**', 'components/**', 'lib/**', 'app/**', 'scripts/**', 'package*.json', 'tests/**', '__tests__/**', 'vitest.config.ts', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['src-tauri/**', 'resources/**', 'public/**', 'components/**', 'lib/**', 'app/**', 'scripts/**', 'package*.json', 'tests/**', '__tests__/**', 'vitest.config.ts', '.github/workflows/desktop.yml']
  workflow_dispatch:
    inputs:
      signed:
        description: Build a signed installer and signed updater artifacts (requires configured secrets)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DESKTOP_API_BASE_URL: ${{ vars.API_BASE_URL }}
      DESKTOP_MEDIA_ORIGINS: ${{ vars.DESKTOP_MEDIA_ORIGINS }}
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Ensure WebView2 runtime
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
          if ((Get-AuthenticodeSignature -LiteralPath $installer).Status -ne 'Valid') { throw 'WebView2 installer signature is invalid.' }
          $install = Start-Process -FilePath $installer -ArgumentList '/silent','/install' -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -notin @(0, 3010)) {
            $runtime = Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\*','HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\*' -ErrorAction SilentlyContinue | Where-Object { $_.name -like '*WebView2*' -and $_.pv -and $_.pv -ne '0.0.0.0' }
            if (!$runtime) { throw "WebView2 installation failed: $($install.ExitCode)" }
          }
      - run: npm ci
      - run: npm run check:secrets
      - run: npm audit --audit-level=moderate
      - run: npm run check:types
      - name: Import signing certificate
        if: inputs.signed == true
        shell: pwsh
        env:
          CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (!$env:CERTIFICATE -or !$env:CERTIFICATE_PASSWORD) { throw 'Configure Windows signing certificate secrets first.' }
          $file = Join-Path $env:RUNNER_TEMP 'desktop-signing.pfx'
          [IO.File]::WriteAllBytes($file, [Convert]::FromBase64String($env:CERTIFICATE))
          try {
            $certificate = Import-PfxCertificate -FilePath $file -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force)
            "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
          } finally { Remove-Item -LiteralPath $file -Force }
      - name: Build unsigned installer
        if: inputs.signed != true
        run: npm run desktop:build -- --locked
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build signed installer and updates
        if: inputs.signed == true
        run: npm run desktop:build -- --locked
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DESKTOP_SIGNED_UPDATES: '1'
          DESKTOP_UPDATER_PUBLIC_KEY: ${{ vars.DESKTOP_UPDATER_PUBLIC_KEY }}
          DESKTOP_UPDATER_ENDPOINT: ${{ vars.DESKTOP_UPDATER_ENDPOINT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Verify public desktop assets
        run: node scripts/verify-pages.mjs
        env:
          HANSTREAM_DESKTOP: '1'
      - name: Check installer and uninstaller
        if: inputs.signed != true
        shell: pwsh
        run: ./scripts/check-installer.ps1
      - name: Check optional signed updater code
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked --features signed-updates
      - name: Prepare signed update manifest
        if: inputs.signed == true
        run: node scripts/create-desktop-update.mjs
        env:
          DESKTOP_DOWNLOAD_BASE_URL: ${{ vars.DESKTOP_DOWNLOAD_BASE_URL }}
      - name: Test app in WebView2
        if: inputs.signed != true
        shell: pwsh
        run: |
          . ./scripts/desktop-window-check.ps1
          Copy-Item -LiteralPath './src-tauri/target/release/hanstream.exe' -Destination (Join-Path $env:RUNNER_TEMP 'hanstream-production.exe')
          npm run desktop:build -- --features automation --no-bundle --locked
          if ($LASTEXITCODE -ne 0) { throw 'Automation harness build failed.' }
          $testBinary = Join-Path $env:RUNNER_TEMP 'hanstream-automation.exe'
          Copy-Item -LiteralPath './src-tauri/target/release/hanstream.exe' -Destination $testBinary
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'hanstream-production.exe') -Destination './src-tauri/target/release/hanstream.exe' -Force
          $env:HANSTREAM_TEST_DATA_DIR=Join-Path $env:RUNNER_TEMP 'hanstream-native-test'
          $log = Join-Path $env:RUNNER_TEMP 'hanstream-app.log'
          $errorLog = Join-Path $env:RUNNER_TEMP 'hanstream-app-error.log'
          $app = Start-Process -FilePath $testBinary -WindowStyle Hidden -PassThru -RedirectStandardOutput $log -RedirectStandardError $errorLog
          $env:HANSTREAM_TEST_PROCESS_ID=$app.Id
          try {
            node scripts/check-desktop.mjs
            if ($LASTEXITCODE -ne 0) {
              $app.Refresh()
              $app | Select-Object Id,HasExited,ExitCode,MainWindowTitle | ConvertTo-Json
              Get-NetTCPConnection -LocalPort 9223 -ErrorAction SilentlyContinue | Select-Object LocalAddress,State,OwningProcess | ConvertTo-Json
              Get-Content $log,$errorLog -ErrorAction SilentlyContinue
              throw 'Desktop smoke test failed.'
            }
            $app.Refresh()
            if ($app.HasExited -or !(Close-HanStreamWindow -AppProcessId $app.Id)) { throw 'The native app did not expose a closable main window.' }
            if (!$app.WaitForExit(15000)) { throw 'Closing the native window with active playback left a background process.' }
          }
          finally { Stop-Process -Id $app.Id -ErrorAction SilentlyContinue }
      - name: Include filter license notices
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path src-tauri/target/release/licenses -Force | Out-Null
          Copy-Item resources/network-blocklist.NOTICE.md src-tauri/target/release/licenses/player-filter-NOTICE.md
          Copy-Item resources/network-blocklist.LICENSE.txt src-tauri/target/release/licenses/player-filter-LICENSE.txt
          Copy-Item src-tauri/windows/LICENSE.template src-tauri/target/release/licenses/installer-template-LICENSE.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HanStream-Windows-${{ github.sha }}
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/nsis/*
            src-tauri/target/release/hanstream.exe
            src-tauri/target/release/licenses/*

      - name: Retain isolated automation harness for playback QA
        uses: actions/upload-artifact@v4
        if: inputs.signed != true && always()
        with:
          name: HanStream-QA-${{ github.sha }}
          retention-days: 1
          path: ${{ runner.temp }}/hanstream-automation.exe
