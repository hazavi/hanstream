name: Security and backend checks
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Rust dependency auditor
        run: cargo install cargo-audit --locked
      - name: Audit desktop dependencies
        run: cargo audit --file src-tauri/Cargo.lock
      - name: Check Windows advisory scope
        run: |
          cargo tree --manifest-path src-tauri/Cargo.toml --locked --target x86_64-pc-windows-msvc --features signed-updates --edges normal,build --prefix none > windows-dependencies.txt
          if rg '^glib v0\.(15|16|17|18|19)\.|^proc-macro-error v1\.' windows-dependencies.txt; then
            echo 'An unresolved off-target advisory has entered the Windows dependency graph.'
            exit 1
          fi
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run check:secrets
      - run: npm run check:types
      - run: npm run build:reader
      - name: Check reader queue with Redis
        run: node scripts/check-reader.mjs
        env:
          CACHE_URL: redis://127.0.0.1:6379
          NODE_ENV: test
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-player-shield.mjs
      - name: Build isolated Vercel website
        run: npm run build:vercel
      - run: node scripts/check-reader-boundary.mjs
      - name: Build backend without private settings
        run: npm run build:backend
        env:
          STREAM_SOURCE_URL: https://stream.invalid
          METADATA_SOURCE_URL: https://metadata.invalid
          EDITORIAL_SOURCE_URL: https://editorial.invalid
          DETAILS_SOURCE_URL: https://details.invalid
