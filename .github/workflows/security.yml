name: Security and backend checks
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run check:secrets
      - run: npm run check:types
      - run: npm test -- --run --maxWorkers=2
      - name: Build backend without private settings
        run: npm run build:backend
        env:
          STREAM_SOURCE_URL: https://stream.invalid
          METADATA_SOURCE_URL: https://metadata.invalid
          EDITORIAL_SOURCE_URL: https://editorial.invalid
          DETAILS_SOURCE_URL: https://details.invalid
