[package]
name = "hanstream"
version = "1.0.2"
description = "HanStream desktop client"
edition = "2021"
rust-version = "1.77.2"

[features]
signed-updates = ["dep:tauri-plugin-updater"]
automation = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-updater = { version = "2", optional = true }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
