services:
  - type: web
    name: hanstream-backend
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: STREAM_SOURCE_URL
        sync: false
      - key: METADATA_SOURCE_URL
        sync: false
      - key: EDITORIAL_SOURCE_URL
        sync: false
      - key: DETAILS_SOURCE_URL
        sync: false
      - key: FRONTEND_ORIGINS
        value: https://hazavi.github.io
