services:
  - type: web
    name: hanstream-backend
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: STREAM_SOURCE_URL
        sync: false
      - key: METADATA_SOURCE_URL
        sync: false
      - key: EDITORIAL_SOURCE_URL
        sync: false
      - key: DETAILS_SOURCE_URL
        sync: false
      - key: CATALOG_SOURCE_URL
        sync: false
      - key: MEDIA_SOURCE_URL
        sync: false
      - key: ARTWORK_SOURCE_URL
        sync: false
      - key: REFERENCE_SOURCE_URL
        sync: false
      - key: POSTER_SEARCH_URLS
        sync: false
      - key: IMAGE_ORIGINS
        sync: false
      - key: FRONTEND_ORIGINS
        value: https://hanstream-backend.onrender.com
      - key: SITE_URL
        value: https://hanstream-backend.onrender.com
